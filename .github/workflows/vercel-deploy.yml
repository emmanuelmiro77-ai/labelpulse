name: Deploy to Vercel

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vercel-deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  trigger-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Trigger Vercel deploy hook
        env:
          DEPLOY_HOOK_URL: ${{ secrets.VERCEL_DEPLOY_HOOK_URL }}
          COMMIT_SHA: ${{ github.sha }}
          COMMIT_MSG: ${{ github.event.head_commit.message }}
        run: |
          set -euo pipefail
          if [ -z "${DEPLOY_HOOK_URL}" ]; then
            echo "::error::VERCEL_DEPLOY_HOOK_URL secret is not set."
            exit 1
          fi
          echo "Triggering Vercel deploy hook for commit ${COMMIT_SHA:0:7}..."
          RESPONSE=$(curl -sS -X POST \
            -H "Content-Type: application/json" \
            -d "{\"ref\": \"main\", \"commitSha\": \"${COMMIT_SHA}\"}" \
            -w "\n%{http_code}" \
            "${DEPLOY_HOOK_URL}")
          HTTP_CODE=$(echo "${RESPONSE}" | tail -n1)
          BODY=$(echo "${RESPONSE}" | sed '$d')
          echo "Vercel API response: HTTP ${HTTP_CODE}"
          echo "Body: ${BODY}"
          if [ "${HTTP_CODE}" != "200" ]; then
            echo "::error::Vercel deploy hook returned HTTP ${HTTP_CODE}."
            exit 1
          fi
          JOB_ID=$(echo "${BODY}" | grep -o '"id":"[^"]*"' | head -1 | cut -d'"' -f4)
          echo "::notice::Vercel deploy triggered. Job ID: ${JOB_ID}"
